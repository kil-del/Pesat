name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Create release keystore
        run: |
          mkdir -p "$RUNNER_TEMP/ks" out
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -keystore "$RUNNER_TEMP/ks/release.jks" -storepass "$PASS" -keypass "$PASS" \
            -alias pesatrack -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=PesaTrack"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ks/release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=pesatrack" >> "$GITHUB_ENV"
          cp "$RUNNER_TEMP/ks/release.jks" out/release.jks
          printf 'alias: pesatrack\nstore/key password: %s\nBACK THIS UP. Losing it means you cannot update the app.\n' "$PASS" > out/KEYSTORE_INFO.txt
      - name: Unit tests, debug and release builds
        run: gradle testDebugUnitTest assembleDebug assembleRelease --stacktrace
      - name: Collect APKs
        run: |
          cp app/build/outputs/apk/debug/*.apk out/PesaTrack-debug.apk
          cp app/build/outputs/apk/release/*.apk out/PesaTrack-release.apk
          ls -lh out
      - uses: actions/upload-artifact@v4
        with:
          name: PesaTrack-APK
          path: out/
